<!doctype html><meta charset="utf-8"><title>결제 완료</title><link rel="stylesheet" href="/styles.css"><header><a href="/">상품 목록</a><a href="/cart">장바구니</a><a href="/account">마이페이지</a></header><main><h1>결제 처리 중</h1><section id="result" class="card"></section></main><script>const p=new URLSearchParams(location.search);fetch('/api/payments/confirm',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({paymentKey:p.get('paymentKey'),orderId:p.get('orderId'),amount:Number(p.get('amount'))})}).then(async r=>{const d=await r.json();document.querySelector('#result').innerHTML=r.ok?'<p>결제가 완료되었습니다.</p><p>주문 번호: '+d.orderId+'</p><a href="/account">마이페이지에서 확인</a>':'<p>결제 승인에 실패했습니다.</p><p>'+d.error+'</p>'}).catch(()=>document.querySelector('#result').textContent='결제 승인 중 오류가 발생했습니다.');</script>
